<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container py-4">
        <h2 class="mb-4 fw-bold">Catálogo de Productos</h2>
        
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            
            <!-- Producto 1: Laptop Gamer (Azul) -->
            <div class="col">
                <div class="card h-100 border-primary">
                    <img src="https://cdn.pixabay.com/photo/2021/06/13/08/29/laptop-6332600_1280.jpg" class="card-img-top" alt="Laptop Gamer" style="height: 180px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Laptop Gamer</h5>
                        <div>
                            <span class="badge bg-primary mb-2">S/ 4,500</span>
                        </div>
                        <p class="card-text text-muted small flex-grow-1">Core i7, 16GB RAM, SSD 512GB.</p>
                        <button class="btn btn-primary w-100">Añadir al Carrito</button>
                    </div>
                </div>
            </div>

            <!-- Producto 2: Mouse Inalámbrico (Verde) -->
            <div class="col">
                <div class="card h-100 border-success">
                    <img src="https://cdn.pixabay.com/photo/2017/05/24/21/33/workplace-2341642_1280.jpg" class="card-img-top" alt="Mouse Inalámbrico" style="height: 180px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Mouse Inalámbrico</h5>
                        <div>
                            <span class="badge bg-success mb-2">S/ 120</span>
                        </div>
                        <p class="card-text text-muted small flex-grow-1">Sensor óptico de alta precisión.</p>
                        <button class="btn btn-success w-100">Añadir al Carrito</button>
                    </div>
                </div>
            </div>

            <!-- Producto 3: Teclado Mecánico (Amarillo) -->
            <div class="col">
                <div class="card h-100 border-warning">
                    <img src="https://cdn.pixabay.com/photo/2012/12/17/19/14/keyboard-70506_1280.jpg" class="card-img-top" alt="Teclado Mecánico" style="height: 180px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Teclado Mecánico</h5>
                        <div>
                            <span class="badge bg-warning text-dark mb-2">S/ 280</span>
                        </div>
                        <p class="card-text text-muted small flex-grow-1">Switches Blue e iluminación RGB.</p>
                        <button class="btn btn-warning text-dark w-100">Añadir al Carrito</button>
                    </div>
                </div>
            </div>

            <!-- Producto 4: Monitor 27" 4K (Rojo) -->
            <div class="col">
                <div class="card h-100 border-danger">
                    <img src="https://cdn.pixabay.com/photo/2015/07/17/22/42/typing-849806_1280.jpg" class="card-img-top" alt="Monitor 27 4K" style="height: 180px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Monitor 27" 4K</h5>
                        <div>
                            <span class="badge bg-danger mb-2">S/ 1,200</span>
                        </div>
                        <p class="card-text text-muted small flex-grow-1">Panel IPS con tasa de refresco de 144Hz.</p>
                        <button class="btn btn-danger w-100">Añadir al Carrito</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
